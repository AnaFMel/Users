name: CI/CD Pipeline - Users.API

on:
  push:
    branches:
      - cloud
  pull_request:
    branches:
      - cloud
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Unit Tests (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  deploy:
    name: Build Docker Image & Deploy to AKS
    needs: build-and-test
    if: github.ref == 'refs/heads/cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # 1. Autenticação na Azure
      - name: Azure Login
        uses: azure/login@v2.2.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 2. Login no ACR
      - name: Login to Azure Container Registry (ACR)
        run: |
          az acr login --name fcgpostech

      # 3. Build & Push da Imagem da UsersAPI
      - name: Build and Push Users.API Docker Image
        run: |
          REGISTRY_URL=fcgpostech.azurecr.io
          docker build -f Users.API/Dockerfile -t $REGISTRY_URL/user-api:${{ github.sha }} -t $REGISTRY_URL/user-api:latest .
          docker push $REGISTRY_URL/user-api:${{ github.sha }}
          docker push $REGISTRY_URL/user-api:latest    

      # =========================================================================
      # ETAPAS DO AKS COMENTADAS PARA EVITAR CUSTOS ENQUANTO O CLUSTER ESTÁ DESLIGADO
