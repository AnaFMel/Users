apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-api
  labels:
    app: user-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-api
  template:
    metadata:
      labels:
        app: user-api
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: user-api
          image: fiapcloudgames.azurecr.io/user-api:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:       
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            
            - name: USERS_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: user-api-config
                  key: USERS_TOPIC
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_SECRET_ACCESS_KEY           
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: JWT_ISSUER
            - name: JWT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: user-api-config
                  key: JWT_SECONDS
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_KEY

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"  
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: user-api
spec:
  type: ClusterIP
  selector:
    app: user-api
  ports:
    - port: 8080
      targetPort: 8080